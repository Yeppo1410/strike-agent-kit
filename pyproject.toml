[project]
name = "strike-agent-kit"
version = "0.1.0"
description = "Agent-native trading on Strike Finance: an MCP server with hard guardrails and a Strike vs Hyperliquid funding board."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "httpx>=0.27", "pynacl>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
strike-agent-kit = "strike_agent_kit.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["strike_agent_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
